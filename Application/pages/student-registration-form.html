<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <link rel="stylesheet" href="../styles/registration.css">
</head>
<body>

<div class="form-container">
    <div class="brand" aria-label="School logo">
        <img src="../assets/logo/school-logo.jpeg" alt="School logo">
    </div>
    <h2>Student Registration Form</h2>
    <p class="form-help">Please fill in all the required fields and submit your registration.</p>
    <form id="registration-form">
        
        <div class="form-group">
            <label id="name-label" for="full-name">Full Name</label>
            <input type="text" id="full-name" name="fullName" placeholder="LAST, NAME, MIDDLE." required>
        </div>

        <div class="form-group">
            <label for="address">Address</label>
            <input type="text" id="address" name="address" placeholder="Enter your address" required>
        </div>

        <div class="form-group">
            <label for="age">Age</label>
            <input type="number" id="age" name="age" placeholder="Enter your number" required>
        </div>

        <div class="form-group">
            <label for="dob">Date of Birth</label>
            <input type="date" id="dob" name="dateOfBirth" required>
        </div>

        <div class="form-group">
            <label for="Birthplace">Birthplace</label>
            <input type="text" id="Birthplace" name="birthplace" placeholder="" required>
        </div>

        <div class="form-group">
            <label for="father">Name of Father</label>
            <input type="text" id="father" name="fatherName" required>
        </div>

        <div class="form-group">
            <label for="mother">Name of Mother</label>
            <input type="text" id="mother" name="motherName" required>
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="example@email.com" required>
        </div>

        <div class="form-group">
            <label for="school">School Attachment</label>
            <select id="school" name="schoolAttachment" required>
                <option value="" disabled selected>Choose an attachment</option>
                <option value="school-id">school ID</option>
                <option value="id-report-card">ID,report card / Form</option>
                <option value="moral-certificate">Good Moral Certificate</option>
                <option value="certificate">Certificate,PSA Birth Certificate</option>
            </select>
        </div>
        <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" placeholder="+63" required>
        </div>

        <div class="form-group">
            <label>Gender</label>
            <div class="radio-group">
                <label><input type="radio" name="gender" value="male" required> Male</label>
                <label><input type="radio" name="gender" value="female"> Female</label>
            </div>
        </div>

        <div class="form-group">
            <label for="course">Select Course</label>
            <select id="course" name="course" required>
                <option value="" disabled selected>Choose a course</option>
                <option value="bscs">BS in COMPUTER SCIENCE</option>
                <option value="bsba">BS in BUSINESS ADMINISTRATION</option>
                <option value="bsa">BS in ACCOUNTANCY</option>
                <option value="bsc">BS in CRIMINOLOGY</option>
                <option value="bse">BS in EDUCATION</option>
            </select>
        </div>

        <button type="submit" class="btn-submit">Submit</button>
    </form>
    <p id="success-message" class="success-message" hidden>Registration submitted successfully!</p>
    <pre id="json-output" class="json-output" hidden></pre>
</div>

<script>
    const form = document.getElementById("registration-form");
    const jsonOutput = document.getElementById("json-output");
    const successMessage = document.getElementById("success-message");

    form.addEventListener("submit", function (event) {
        event.preventDefault();

        const registration = {
            fullName: document.getElementById("full-name").value,
            address: document.getElementById("address").value,
            age: Number(document.getElementById("age").value),
            dateOfBirth: document.getElementById("dob").value,
            birthplace: document.getElementById("Birthplace").value,
            fatherName: document.getElementById("father").value,
            motherName: document.getElementById("mother").value,
            email: document.getElementById("email").value,
            schoolAttachment: document.getElementById("school").value,
            phone: document.getElementById("phone").value,
            gender: document.querySelector('input[name="gender"]:checked').value,
            course: document.getElementById("course").value
        };

        const jsonText = JSON.stringify(registration, null, 2);
        jsonOutput.textContent = jsonText;
        jsonOutput.hidden = false;
        successMessage.hidden = false;

        const file = new Blob([jsonText], {
            type: "application/json"
        });
        const downloadLink = document.createElement("a");
        downloadLink.href = URL.createObjectURL(file);
        downloadLink.download = "student-registration.json";
        downloadLink.click();
        URL.revokeObjectURL(downloadLink.href);

        setTimeout(() => {
            window.location.href = "dashboard.html";
        }, 500);
    });
</script>

</body>
</html>
